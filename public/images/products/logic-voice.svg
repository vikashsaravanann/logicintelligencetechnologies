<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070C1A"/>
      <stop offset="50%" stop-color="#0A1128"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#9D4EDD"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#9D4EDD" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="800" height="500" fill="url(#bgGrad)" />
  <rect width="800" height="500" fill="url(#grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="650" cy="150" r="180" fill="url(#glowGrad)" filter="url(#glow)"/>
  <circle cx="150" cy="400" r="140" fill="#00D2FF" fill-opacity="0.08" filter="url(#glow)"/>

  <!-- Top Border Accent Line -->
  <rect x="0" y="0" width="800" height="3" fill="url(#accentGrad)"/>

  <!-- Graphical Elements Center/Right - Voice Interface -->
  <g transform="translate(380, 80)">
    <g transform="translate(40, 30)">
      <rect x="0" y="0" width="300" height="220" rx="16" fill="#0A162B" stroke="#00D2FF" stroke-opacity="0.4" stroke-width="1.5"/>
      <!-- Waveform Bars -->
      <g transform="translate(40, 110)">
        <rect x="0" y="-15" width="6" height="30" rx="3" fill="#00D2FF"/>
        <rect x="14" y="-35" width="6" height="70" rx="3" fill="#00D2FF"/>
        <rect x="28" y="-55" width="6" height="110" rx="3" fill="#3A86FF"/>
        <rect x="42" y="-25" width="6" height="50" rx="3" fill="#8338EC"/>
        <rect x="56" y="-65" width="6" height="130" rx="3" fill="#00D2FF"/>
        <rect x="70" y="-40" width="6" height="80" rx="3" fill="#3A86FF"/>
        <rect x="84" y="-75" width="6" height="150" rx="3" fill="#8338EC"/>
        <rect x="98" y="-50" width="6" height="100" rx="3" fill="#00D2FF"/>
        <rect x="112" y="-30" width="6" height="60" rx="3" fill="#3A86FF"/>
        <rect x="126" y="-60" width="6" height="120" rx="3" fill="#8338EC"/>
        <rect x="140" y="-45" width="6" height="90" rx="3" fill="#00D2FF"/>
        <rect x="154" y="-25" width="6" height="50" rx="3" fill="#3A86FF"/>
        <rect x="168" y="-45" width="6" height="90" rx="3" fill="#8338EC"/>
        <rect x="182" y="-20" width="6" height="40" rx="3" fill="#00D2FF"/>
        <rect x="196" y="-10" width="6" height="20" rx="3" fill="#3A86FF"/>
        <rect x="210" y="-5" width="6" height="10" rx="3" fill="#8338EC"/>
      </g>
      <!-- Sub-panel badges -->
      <rect x="30" y="25" width="100" height="20" rx="6" fill="#132747"/>
      <circle cx="42" cy="35" r="4" fill="#00D2FF"/>
      <rect x="140" y="25" width="130" height="20" rx="6" fill="#132747"/>
      <circle cx="152" cy="35" r="4" fill="#9D4EDD"/>
    </g>
  </g>

  <!-- Left Content Overlay -->
  <g transform="translate(60, 80)">
    <!-- Badge -->
    <rect x="0" y="0" width="220" height="26" rx="13" fill="rgba(255,255,255,0.06)" stroke="#00D2FF" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#00D2FF"/>
    <text x="26" y="17" fill="#00D2FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">FLAGSHIP AI PRODUCT</text>

    <!-- Category -->
    <text x="0" y="60" fill="rgba(255,255,255,0.5)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="2" text-transform="uppercase">Personal AI Assistant</text>

    <!-- Title -->
    <text x="0" y="100" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">
      Logic Voice
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="130" fill="#00D2FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">
      Voice-First Personal AI Assistant
    </text>

    <!-- Status pill -->
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="140" height="24" rx="6" fill="#132747" stroke="#00D2FF" stroke-width="1"/>
      <text x="12" y="16" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" letter-spacing="0.5">Speech · Reasoning · Tools</text>
    </g>
  </g>
</svg>
