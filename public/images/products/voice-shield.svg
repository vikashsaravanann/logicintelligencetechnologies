<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="vsBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070B"/>
      <stop offset="50%" stop-color="#0B1320"/>
      <stop offset="100%" stop-color="#040609"/>
    </linearGradient>
    <linearGradient id="vsCyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2C4"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="vsShieldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2C4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.05"/>
    </linearGradient>
    <pattern id="vsGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
    <filter id="vsGlowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="800" height="500" fill="url(#vsBgGrad)" />
  <rect width="800" height="500" fill="url(#vsGrid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="620" cy="220" r="160" fill="url(#vsShieldGlow)" filter="url(#vsGlowFilter)"/>
  <circle cx="120" cy="380" r="120" fill="#00D2C4" fill-opacity="0.05" filter="url(#vsGlowFilter)"/>

  <!-- Top Border Accent Line -->
  <rect x="0" y="0" width="800" height="3" fill="url(#vsCyanGrad)"/>

  <!-- Graphical Shield & Acoustic Waveform Center/Right -->
  <g transform="translate(460, 90)">
    <!-- Shield Outer Outline -->
    <path d="M 140 20 L 250 60 C 250 180 180 260 140 290 C 100 260 30 180 30 60 Z" 
          fill="#0B1526" stroke="#00D2C4" stroke-width="2.5" stroke-linejoin="round" opacity="0.95"/>
    <!-- Shield Inner Core -->
    <path d="M 140 45 L 225 75 C 225 170 170 235 140 260 C 110 235 55 170 55 75 Z" 
          fill="#060C16" stroke="rgba(56,189,248,0.4)" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- Acoustic Waveform Bars Inside Shield -->
    <g transform="translate(85, 120)">
      <rect x="0" y="24" width="4" height="20" rx="2" fill="#00D2C4" opacity="0.6"/>
      <rect x="10" y="16" width="4" height="36" rx="2" fill="#00D2C4" opacity="0.7"/>
      <rect x="20" y="8" width="4" height="52" rx="2" fill="#38BDF8" opacity="0.85"/>
      <rect x="30" y="2" width="4" height="64" rx="2" fill="#00D2C4"/>
      <rect x="40" y="12" width="4" height="44" rx="2" fill="#38BDF8"/>
      <rect x="50" y="0" width="4" height="68" rx="2" fill="#00D2C4"/>
      <rect x="60" y="18" width="4" height="32" rx="2" fill="#38BDF8" opacity="0.8"/>
      <rect x="70" y="8" width="4" height="52" rx="2" fill="#00D2C4" opacity="0.85"/>
      <rect x="80" y="14" width="4" height="40" rx="2" fill="#38BDF8" opacity="0.7"/>
      <rect x="90" y="24" width="4" height="20" rx="2" fill="#00D2C4" opacity="0.6"/>
      <rect x="100" y="28" width="4" height="12" rx="2" fill="#38BDF8" opacity="0.4"/>
    </g>

    <!-- Radar / Ring Sensor -->
    <circle cx="140" cy="155" r="75" fill="none" stroke="rgba(0,210,196,0.25)" stroke-dasharray="4 6"/>
    <circle cx="140" cy="155" r="95" fill="none" stroke="rgba(56,189,248,0.15)" stroke-dasharray="2 8"/>
    
    <!-- Verified Lock Beacon -->
    <g transform="translate(130, 205)">
      <circle cx="10" cy="10" r="14" fill="#00D2C4" fill-opacity="0.2" stroke="#00D2C4" stroke-width="1.5"/>
      <path d="M 6 10 L 9 13 L 15 7" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Left Content Overlay -->
  <g transform="translate(60, 75)">
    <!-- Badge -->
    <rect x="0" y="0" width="210" height="26" rx="13" fill="rgba(255,255,255,0.06)" stroke="#00D2C4" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#00D2C4"/>
    <text x="26" y="17" fill="#00D2C4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">AI VOICE DEFENSE SUITE</text>

    <!-- Category -->
    <text x="0" y="60" fill="rgba(255,255,255,0.5)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="2" text-transform="uppercase">Biometric Security &amp; Firewall</text>

    <!-- Title -->
    <text x="0" y="100" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800" letter-spacing="-0.5">
      Voice Shield
    </text>
    <text x="0" y="136" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" letter-spacing="-0.5">
      Audio Firewall
    </text>

    <!-- Subtitle -->
    <text x="0" y="176" fill="rgba(255,255,255,0.7)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      Real-Time Voice Authentication &amp; Deepfake Defense
    </text>

    <!-- Telemetry Badges -->
    <g transform="translate(0, 210)">
      <rect x="0" y="0" width="96" height="24" rx="4" fill="#0B1320" stroke="rgba(0,210,196,0.3)" stroke-width="1"/>
      <text x="48" y="16" text-anchor="middle" fill="#00D2C4" font-family="Courier, monospace" font-size="11" font-weight="700">&lt;15MS FAST</text>

      <rect x="106" y="0" width="105" height="24" rx="4" fill="#0B1320" stroke="rgba(56,189,248,0.3)" stroke-width="1"/>
      <text x="158" y="16" text-anchor="middle" fill="#38BDF8" font-family="Courier, monospace" font-size="11" font-weight="700">99.4% ACCURACY</text>

      <rect x="221" y="0" width="112" height="24" rx="4" fill="#0B1320" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
      <text x="277" y="16" text-anchor="middle" fill="#E2E8F0" font-family="Courier, monospace" font-size="11" font-weight="700">ZERO RETENTION</text>
    </g>

    <!-- Tech specs / decorative telemetry bar -->
    <g transform="translate(0, 280)">
      <rect x="0" y="0" width="340" height="1" fill="rgba(255,255,255,0.12)"/>
      <circle cx="0" cy="0" r="2" fill="#00D2C4"/>
      <circle cx="340" cy="0" r="2" fill="#38BDF8"/>
      <text x="0" y="24" fill="rgba(255,255,255,0.45)" font-family="Courier, monospace" font-size="10" letter-spacing="1">SYSTEM ID: LIT-VS-2026</text>
      <text x="0" y="42" fill="rgba(255,255,255,0.35)" font-family="Courier, monospace" font-size="9" letter-spacing="0.5">PROTOCOL: SIP / SRTP / WEBRTC / FASTPATH NEURAL</text>
    </g>
  </g>

  <!-- Bottom Right System Watermark -->
  <text x="740" y="465" text-anchor="end" fill="rgba(255,255,255,0.18)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1">LOGIC INTELLIGENCE TECHNOLOGIES</text>
</svg>