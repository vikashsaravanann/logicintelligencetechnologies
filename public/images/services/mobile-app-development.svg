<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070C1A"/>
      <stop offset="50%" stop-color="#0A1128"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00BFFF"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00BFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="800" height="500" fill="url(#bgGrad)" />
  <rect width="800" height="500" fill="url(#grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="650" cy="150" r="180" fill="url(#glowGrad)" filter="url(#glow)"/>
  <circle cx="150" cy="400" r="140" fill="#00E5FF" fill-opacity="0.08" filter="url(#glow)"/>

  <!-- Top Border Accent Line -->
  <rect x="0" y="0" width="800" height="3" fill="url(#accentGrad)"/>

  <!-- Graphical Elements Center/Right -->
  <g transform="translate(380, 70)">
    
      <g transform="translate(90, 20)">
        <rect x="50" y="10" width="160" height="260" rx="24" fill="#071220" stroke="#00BFFF" stroke-width="2"/>
        <rect x="90" y="18" width="80" height="12" rx="6" fill="#10233B"/>
        <rect x="65" y="45" width="130" height="60" rx="8" fill="#10253F"/>
        <circle cx="90" cy="75" r="16" fill="#00BFFF" fill-opacity="0.4"/>
        <rect x="120" y="65" width="60" height="8" rx="4" fill="#FFF"/>
        <rect x="120" y="80" width="40" height="6" rx="3" fill="#00BFFF"/>
        <rect x="65" y="120" width="60" height="60" rx="8" fill="#132B4A"/>
        <rect x="135" y="120" width="60" height="60" rx="8" fill="#132B4A"/>
        <rect x="65" y="195" width="130" height="35" rx="8" fill="#00BFFF"/>
        <text x="130" y="217" text-anchor="middle" fill="#000" font-family="sans-serif" font-size="10" font-weight="800">LAUNCH APP</text>
      </g>
    
  </g>

  <!-- Left Content Overlay -->
  <g transform="translate(60, 80)">
    <!-- Badge -->
    <rect x="0" y="0" width="144" height="26" rx="13" fill="rgba(255,255,255,0.06)" stroke="#00BFFF" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#00BFFF"/>
    <text x="26" y="17" fill="#00BFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">LIT ENGINEERING</text>

    <!-- Category -->
    <text x="0" y="60" fill="rgba(255,255,255,0.5)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="2" text-transform="uppercase">Mobile Systems</text>

    <!-- Title -->
    <text x="0" y="100" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">
      Mobile App
    </text>
    <text x="0" y="135" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">Engineering</text>

    <!-- Subtitle -->
    <text x="0" y="175" fill="rgba(255,255,255,0.65)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      React Native · iOS & Android · Offline-First Architecture
    </text>

    <!-- Tech specs / decorative telemetry bar -->
    <g transform="translate(0, 270)">
      <rect x="0" y="0" width="260" height="1" fill="rgba(255,255,255,0.12)"/>
      <circle cx="0" cy="0" r="2" fill="#00BFFF"/>
      <circle cx="260" cy="0" r="2" fill="#00E5FF"/>
      <text x="0" y="24" fill="rgba(255,255,255,0.4)" font-family="Courier, monospace" font-size="10" letter-spacing="1">SYSTEM ID: LIT-MS-2026</text>
      <text x="0" y="42" fill="rgba(255,255,255,0.3)" font-family="Courier, monospace" font-size="9" letter-spacing="0.5">STATUS: PRODUCTION READY // VERIFIED</text>
    </g>
  </g>

  <!-- Bottom Right System Watermark -->
  <text x="740" y="465" text-anchor="end" fill="rgba(255,255,255,0.18)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1">LOGIC INTELLIGENCE TECHNOLOGIES</text>
</svg>