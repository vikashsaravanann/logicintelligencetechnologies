<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070C1A"/>
      <stop offset="50%" stop-color="#0A1128"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#7B2FBE"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7B2FBE" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="800" height="500" fill="url(#bgGrad)" />
  <rect width="800" height="500" fill="url(#grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="650" cy="150" r="180" fill="url(#glowGrad)" filter="url(#glow)"/>
  <circle cx="150" cy="400" r="140" fill="#7B2FBE" fill-opacity="0.08" filter="url(#glow)"/>

  <!-- Top Border Accent Line -->
  <rect x="0" y="0" width="800" height="3" fill="url(#accentGrad)"/>

  <!-- Graphical Elements Center/Right -->
  <g transform="translate(380, 70)">
    
      <g transform="translate(40, 40)">
        <rect x="20" y="20" width="300" height="210" rx="14" fill="#0C1B2A" stroke="#00E5FF" stroke-width="1.5"/>
        <polygon points="170,45 250,85 170,125 90,85" fill="#163450" stroke="#00E5FF" stroke-width="2"/>
        <polygon points="170,110 230,85 170,60 110,85" fill="#00E5FF" fill-opacity="0.3"/>
        <rect x="50" y="145" width="240" height="65" rx="8" fill="#102336" stroke="rgba(255,255,255,0.1)"/>
        <text x="70" y="172" fill="#FFF" font-family="sans-serif" font-size="11" font-weight="700">Real-Time Student Analytics</text>
        <text x="70" y="192" fill="#00E5FF" font-family="sans-serif" font-size="9">Parent-Teacher Sync // Live Fees</text>
      </g>
    
  </g>

  <!-- Left Content Overlay -->
  <g transform="translate(60, 80)">
    <!-- Badge -->
    <rect x="0" y="0" width="144" height="26" rx="13" fill="rgba(255,255,255,0.06)" stroke="#00E5FF" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#00E5FF"/>
    <text x="26" y="17" fill="#00E5FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">LIT ENGINEERING</text>

    <!-- Category -->
    <text x="0" y="60" fill="rgba(255,255,255,0.5)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="2" text-transform="uppercase">EdTech Systems</text>

    <!-- Title -->
    <text x="0" y="100" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">
      Education & School
    </text>
    <text x="0" y="135" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">Management Software</text>

    <!-- Subtitle -->
    <text x="0" y="175" fill="rgba(255,255,255,0.65)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      Student Lifecycle · Attendance · Grading & Fee Automation
    </text>

    <!-- Tech specs / decorative telemetry bar -->
    <g transform="translate(0, 270)">
      <rect x="0" y="0" width="260" height="1" fill="rgba(255,255,255,0.12)"/>
      <circle cx="0" cy="0" r="2" fill="#00E5FF"/>
      <circle cx="260" cy="0" r="2" fill="#7B2FBE"/>
      <text x="0" y="24" fill="rgba(255,255,255,0.4)" font-family="Courier, monospace" font-size="10" letter-spacing="1">SYSTEM ID: LIT-ETS-2026</text>
      <text x="0" y="42" fill="rgba(255,255,255,0.3)" font-family="Courier, monospace" font-size="9" letter-spacing="0.5">STATUS: PRODUCTION READY // VERIFIED</text>
    </g>
  </g>

  <!-- Bottom Right System Watermark -->
  <text x="740" y="465" text-anchor="end" fill="rgba(255,255,255,0.18)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1">LOGIC INTELLIGENCE TECHNOLOGIES</text>
</svg>