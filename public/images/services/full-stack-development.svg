<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070C1A"/>
      <stop offset="50%" stop-color="#0A1128"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00BFFF"/>
      <stop offset="100%" stop-color="#7B2FBE"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00BFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7B2FBE" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="800" height="500" fill="url(#bgGrad)" />
  <rect width="800" height="500" fill="url(#grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="650" cy="150" r="180" fill="url(#glowGrad)" filter="url(#glow)"/>
  <circle cx="150" cy="400" r="140" fill="#7B2FBE" fill-opacity="0.08" filter="url(#glow)"/>

  <!-- Top Border Accent Line -->
  <rect x="0" y="0" width="800" height="3" fill="url(#accentGrad)"/>

  <!-- Graphical Elements Center/Right -->
  <g transform="translate(380, 70)">
    
      <rect x="20" y="30" width="340" height="240" rx="12" fill="#0D162B" stroke="#00BFFF" stroke-width="1.5" stroke-opacity="0.6"/>
      <rect x="20" y="30" width="340" height="32" rx="12" fill="#13203C"/>
      <circle cx="44" cy="46" r="5" fill="#FF5F56"/>
      <circle cx="62" cy="46" r="5" fill="#FFBD2E"/>
      <circle cx="80" cy="46" r="5" fill="#27C93F"/>
      <path d="M 90 120 L 60 150 L 90 180" stroke="#00BFFF" stroke-width="3" stroke-linecap="round" fill="none"/>
      <path d="M 290 120 L 320 150 L 290 180" stroke="#7B2FBE" stroke-width="3" stroke-linecap="round" fill="none"/>
      <line x1="175" y1="185" x2="205" y2="115" stroke="rgba(255,255,255,0.4)" stroke-width="3" stroke-linecap="round"/>
      <rect x="110" y="90" width="160" height="28" rx="6" fill="#182A50" stroke="#00BFFF" stroke-width="1"/>
      <rect x="110" y="130" width="160" height="28" rx="6" fill="#182A50" stroke="#00FF88" stroke-width="1"/>
      <rect x="110" y="170" width="160" height="28" rx="6" fill="#182A50" stroke="#7B2FBE" stroke-width="1"/>
      <circle cx="126" cy="104" r="3" fill="#00BFFF"/>
      <circle cx="126" cy="144" r="3" fill="#00FF88"/>
      <circle cx="126" cy="184" r="3" fill="#7B2FBE"/>
      <text x="140" y="108" fill="#FFF" font-family="monospace" font-size="10">Frontend: Next.js</text>
      <text x="140" y="148" fill="#FFF" font-family="monospace" font-size="10">API: Node / REST</text>
      <text x="140" y="188" fill="#FFF" font-family="monospace" font-size="10">DB: PostgreSQL</text>
    
  </g>

  <!-- Left Content Overlay -->
  <g transform="translate(60, 80)">
    <!-- Badge -->
    <rect x="0" y="0" width="144" height="26" rx="13" fill="rgba(255,255,255,0.06)" stroke="#00BFFF" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#00BFFF"/>
    <text x="26" y="17" fill="#00BFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">LIT ENGINEERING</text>

    <!-- Category -->
    <text x="0" y="60" fill="rgba(255,255,255,0.5)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="2" text-transform="uppercase">Full Stack</text>

    <!-- Title -->
    <text x="0" y="100" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">
      Full Stack Web
    </text>
    <text x="0" y="135" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">Development</text>

    <!-- Subtitle -->
    <text x="0" y="175" fill="rgba(255,255,255,0.65)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      React · Next.js · Node · Cloud Databases
    </text>

    <!-- Tech specs / decorative telemetry bar -->
    <g transform="translate(0, 270)">
      <rect x="0" y="0" width="260" height="1" fill="rgba(255,255,255,0.12)"/>
      <circle cx="0" cy="0" r="2" fill="#00BFFF"/>
      <circle cx="260" cy="0" r="2" fill="#7B2FBE"/>
      <text x="0" y="24" fill="rgba(255,255,255,0.4)" font-family="Courier, monospace" font-size="10" letter-spacing="1">SYSTEM ID: LIT-FS-2026</text>
      <text x="0" y="42" fill="rgba(255,255,255,0.3)" font-family="Courier, monospace" font-size="9" letter-spacing="0.5">STATUS: PRODUCTION READY // VERIFIED</text>
    </g>
  </g>

  <!-- Bottom Right System Watermark -->
  <text x="740" y="465" text-anchor="end" fill="rgba(255,255,255,0.18)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1">LOGIC INTELLIGENCE TECHNOLOGIES</text>
</svg>