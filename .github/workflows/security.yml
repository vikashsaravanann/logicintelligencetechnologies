name: Security Audit

on:
  schedule:
    - cron: "0 2 * * *"
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Production dependency audit (high/critical fail closed)
        id: production_audit
        run: |
          set +e
          npm audit --omit=dev --audit-level=high --json \
            --fetch-retries=3 --fetch-retry-mintimeout=1000 \
            --fetch-retry-maxtimeout=10000 --fetch-timeout=60000 \
            > npm-audit-production.json
          code=$?
          echo "npm_audit_exit_code=$code" >> "$GITHUB_OUTPUT"
          # An unavailable npm registry is NOT a clean security result.
          # Both vulnerabilities and audit transport failures fail this gate.
          exit "$code"

      - name: Upload production audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-dependency-audit
          path: npm-audit-production.json
          if-no-files-found: warn

      - name: Secret scanning (literal secrets only)
        run: |
          set -euo pipefail
          PATTERN='(sk_live_[0-9a-zA-Z]{20,}|pk_live_[0-9a-zA-Z]{20,}|xoxb-[0-9A-Za-z-]{20,}|ghp_[0-9A-Za-z]{30,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |OPENSSH )?PRIVATE KEY-----)'
          if grep -RInE "$PATTERN" src/ --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' --include='*.mjs' --include='*.json' 2>/dev/null; then
            echo "Hardcoded secret material detected in source."
            exit 1
          fi
          echo "No hardcoded secret material detected in src/."
