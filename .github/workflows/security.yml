name: Security Audit

on:
  schedule:
    - cron: "0 2 * * *"
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          npm ci || npm install --no-audit --no-fund

      - name: NPM Audit (report high/critical; do not block on transitive noise)
        run: |
          npm audit --audit-level=critical || true
          npm audit --json > npm-audit.json || true
        continue-on-error: true

      - name: Secret scanning (literal secrets only)
        run: |
          set -euo pipefail
          PATTERN='(sk_live_[0-9a-zA-Z]{20,}|pk_live_[0-9a-zA-Z]{20,}|xoxb-[0-9A-Za-z-]{20,}|ghp_[0-9A-Za-z]{30,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |OPENSSH )?PRIVATE KEY-----)'
          if grep -RInE "$PATTERN" src/ --include='*.ts' --include='*.tsx' --include='*.js' --include='*.jsx' --include='*.mjs' --include='*.json' 2>/dev/null; then
            echo "Hardcoded secret material detected in source."
            exit 1
          fi
          echo "No hardcoded secret material detected in src/."
