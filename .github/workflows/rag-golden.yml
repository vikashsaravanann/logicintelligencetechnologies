name: RAG golden eval
on:
  pull_request:
  push:
    paths:
      - "src/lib/ai/**"
      - "src/data/**"
      - "scripts/eval-rag-golden.mjs"
      - "src/lib/ai/golden-set.json"
      - ".github/workflows/rag-golden.yml"
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run 10+ company golden questions (lexical RAG)
        run: node scripts/eval-rag-golden.mjs
