name: grok-review

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      # Disabled until a pinned, bounded API-only implementation is reviewed.
      # No checkout of PR code, AI secret, writable token or remote installer.
      - name: Review automation disabled pending a safe implementation
        run: |
          printf '%s\n' 'Grok review is disabled for security. Use human review and existing CI checks.' >> "$GITHUB_STEP_SUMMARY"
