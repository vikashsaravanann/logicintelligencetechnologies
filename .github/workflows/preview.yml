name: Preview Deployment

on:
  pull_request:
    branches: [main]

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  CANONICAL_PRODUCTION_URL: "https://www.logicintelligencetechnologies.in"
  CANONICAL_VERCEL_PROJECT_ID: "prj_Oij4lC7BxRmiAcxim3REtNuNms0y"

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Typecheck gate
        run: npm run typecheck

      - name: Preflight Vercel CLI token & resolve preview target
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_Oij4lC7BxRmiAcxim3REtNuNms0y' }}
          REQUESTED_MODE: ${{ vars.VERCEL_DEPLOY_MODE || 'native_git' }}
        run: |
          set -euo pipefail
          # Never print or echo token values in logs.
          if [ "$REQUESTED_MODE" = "cli" ] && [ -n "${VERCEL_TOKEN:-}" ]; then
            if npx --yes vercel@latest whoami --token="$VERCEL_TOKEN" >/dev/null 2>&1; then
              npx --yes vercel@latest pull --yes --environment=preview --token="$VERCEL_TOKEN"
              URL=$(npx --yes vercel@latest deploy --archive=tgz --token="$VERCEL_TOKEN" --yes 2>/dev/null || echo "${CANONICAL_PRODUCTION_URL}")
              echo "mode=cli" >> "$GITHUB_OUTPUT"
              echo "url=${URL}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "::notice::Vercel native Git integration is primary; CLI token preflight skipped/expired — verifying live deployment on https://www.logicintelligencetechnologies.in"
          echo "mode=native_git" >> "$GITHUB_OUTPUT"
          echo "url=${CANONICAL_PRODUCTION_URL}" >> "$GITHUB_OUTPUT"

      - name: Live smoke & domain verification gate
        env:
          SMOKE_TEST_BASE_URL: ${{ steps.vercel.outputs.url }}
        run: npm run smoke:test

      - name: Comment PR with verification status
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const mode = '${{ steps.vercel.outputs.mode }}';
              const targetUrl = '${{ steps.vercel.outputs.url }}';
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `✅ Deployment & smoke verification passed (mode: \`${mode}\`, project: \`prj_Oij4lC7BxRmiAcxim3REtNuNms0y\`).\nVerified target: ${targetUrl}`
              });
            } catch (err) {
              console.log('Unable to create PR comment:', err.message);
            }

