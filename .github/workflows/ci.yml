name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Public build-time placeholders so Next build does not require live secrets in CI
          NEXT_PUBLIC_SITE_URL: https://www.logicintelligencetechnologies.in
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.placeholder

      - name: Unit tests
        run: npm run test:unit
        continue-on-error: false

      - name: Integration tests
        run: npm run test:integration
        continue-on-error: false

      - name: Verify PDFs (informational until assets uploaded)
        run: npm run verify:pdfs
        continue-on-error: false

      - name: Verify environment shape (informational in CI)
        run: npm run verify:environment
        continue-on-error: false
        env:
          VERIFY_ENV_MODE: development
