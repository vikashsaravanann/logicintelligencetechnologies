name: restore-glass-pages
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/restore-glass-pages.py
      - .github/workflows/restore-glass-pages.yml
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 40
      - run: python3 scripts/restore-glass-pages.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then echo No changes; exit 0; fi
          git commit -m "fix(ui): restore marketing pages + glass-card grid migration"
          git push
