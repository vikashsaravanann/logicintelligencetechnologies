name: Keep Logic Voice backend awake

# The Logic Voice backend runs on Render's free plan, which sleeps after about
# 15 minutes without traffic and then takes 25-50 s to wake. A request every
# 10 minutes keeps it awake so sign-in is fast. This lives in this repository
# because public repositories run Actions without a minutes quota; the Logic
# Voice repository is private and would spend roughly 4,300 billed minutes a
# month on these runs.
#
# Render's free plan includes 750 instance hours a month per workspace; one
# always-awake service uses about 744. Turn this off (disable the workflow) if
# other free Render services share the workspace, or move the backend to a
# paid instance and delete this file.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-logic-voice-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        env:
          URL: https://logicvoice-backend.onrender.com/health
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 --retry 2 --retry-delay 5 "$URL" || echo 000)
          echo "GET $URL -> $code"
          # A down backend is reported as a warning, not a failed run, so a
          # Render outage does not send a failure email every 10 minutes.
          if [ "$code" != "200" ]; then
            echo "::warning title=Logic Voice backend::/health returned $code"
          fi
