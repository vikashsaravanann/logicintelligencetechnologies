name: Synthetic Staff Handoff E2E

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "HTTPS URL for an ISOLATED staging/preview deployment (never production)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: synthetic-handoff-${{ github.ref }}
  cancel-in-progress: false

jobs:
  staff-handoff-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    env:
      PLAYWRIGHT_BASE_URL: ${{ inputs.base_url }}
      RUN_SYNTHETIC_HANDOFF: "1"
      E2E_CLIENT_EMAIL: ${{ secrets.E2E_CLIENT_EMAIL }}
      E2E_CLIENT_PASSWORD: ${{ secrets.E2E_CLIENT_PASSWORD }}
      E2E_STAFF_EMAIL: ${{ secrets.E2E_STAFF_EMAIL }}
      E2E_STAFF_PASSWORD: ${{ secrets.E2E_STAFF_PASSWORD }}
      E2E_PROJECT_LABEL: ${{ vars.E2E_PROJECT_LABEL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Validate staging scope and required fixtures
        run: |
          node - <<'NODE'
          const names = [
            'PLAYWRIGHT_BASE_URL','E2E_CLIENT_EMAIL','E2E_CLIENT_PASSWORD',
            'E2E_STAFF_EMAIL','E2E_STAFF_PASSWORD','E2E_PROJECT_LABEL'
          ];
          const missing = names.filter(name => !process.env[name]);
          if (missing.length) {
            console.error('Missing required synthetic E2E inputs: ' + missing.join(', '));
            process.exit(1);
          }
          const url = new URL(process.env.PLAYWRIGHT_BASE_URL);
          if (url.protocol !== 'https:' || /^(www\.)?logicintelligencetechnologies\.in$/i.test(url.hostname)) {
            console.error('Synthetic E2E must target an isolated HTTPS staging/preview deployment.');
            process.exit(1);
          }
          console.log('Staging scope validated; synthetic fixture variables present.');
          NODE

      - name: Install locked dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Authenticated desktop and mobile handoff E2E
        run: npm run test:e2e -- tests/e2e/staff/client-staff-handoff.spec.ts

      - name: Upload browser traces and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-staff-handoff-playwright
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
