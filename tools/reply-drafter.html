<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reply Drafter — Logic Intelligence Technologies</title>
<style>
  :root {
    --bg: #0a0f1e;
    --panel: #10182b;
    --border: #1f2b45;
    --text: #e5e9f0;
    --muted: #8892a6;
    --primary: #00bfff;
    --primary-dim: #0090c0;
    --danger: #ff5d5d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .wrap {
    max-width: 920px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 8px;
  }
  h1 {
    font-size: 20px;
    font-weight: 700;
    margin: 0;
  }
  .subtitle {
    color: var(--muted);
    font-size: 13px;
  }
  .key-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 8px;
    cursor: pointer;
  }
  .key-btn:hover { border-color: var(--primary); color: var(--primary); }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
  }
  label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin-bottom: 8px;
  }
  textarea, select, input[type=text] {
    width: 100%;
    background: #0d1424;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    padding: 12px;
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
  }
  textarea:focus, select:focus, input:focus {
    outline: none;
    border-color: var(--primary);
  }
  #clientEmail { margin-bottom: 14px; }
  #clientMessage { min-height: 140px; margin-bottom: 14px; }

  .row {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .row > div { flex: 1; min-width: 160px; }

  .draft-btn {
    background: var(--primary);
    color: #001018;
    border: none;
    font-weight: 700;
    font-size: 14px;
    padding: 12px 22px;
    border-radius: 10px;
    cursor: pointer;
    width: 100%;
  }
  .draft-btn:hover { background: var(--primary-dim); }
  .draft-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .output {
    white-space: pre-wrap;
    font-size: 14px;
    line-height: 1.6;
    min-height: 80px;
  }
  .output.empty { color: var(--muted); font-style: italic; }

  .output-actions {
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }
  .ghost-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
  }
  .ghost-btn:hover { border-color: var(--primary); color: var(--primary); }

  .error {
    color: var(--danger);
    font-size: 13px;
    margin-top: 10px;
  }

  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    max-width: 420px;
    width: 90%;
  }
  .modal h2 { margin: 0 0 8px; font-size: 16px; }
  .modal p { color: var(--muted); font-size: 13px; line-height: 1.5; }
  .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <h1>Reply Drafter</h1>
      <div class="subtitle">Internal tool — Logic Intelligence Technologies</div>
    </div>
    <button class="key-btn" id="keyBtn">API key</button>
  </header>

  <div class="panel">
    <label for="clientEmail">Client email (optional, for your reference only)</label>
    <input type="text" id="clientEmail" placeholder="client@example.com" />

    <label for="clientMessage">Paste the client's message</label>
    <textarea id="clientMessage" placeholder="Paste what the client wrote here..."></textarea>

    <div class="row">
      <div>
        <label for="tone">Tone</label>
        <select id="tone">
          <option value="friendly and professional">Friendly & professional</option>
          <option value="formal and concise">Formal & concise</option>
          <option value="apologetic, for a delay or issue">Apologetic (delay/issue)</option>
          <option value="firm but polite, for a scope or payment boundary">Firm but polite (boundary)</option>
          <option value="enthusiastic, for good news or a signed deal">Enthusiastic (good news)</option>
        </select>
      </div>
      <div>
        <label for="context">Extra context (optional)</label>
        <input type="text" id="context" placeholder="e.g. this is our 2nd follow-up, project is the Business Pro Pack" />
      </div>
    </div>

    <button class="draft-btn" id="draftBtn">Draft reply</button>
    <div class="error" id="errorMsg" style="display:none;"></div>
  </div>

  <div class="panel">
    <label>Draft</label>
    <div class="output empty" id="output">Your drafted reply will appear here.</div>
    <div class="output-actions" id="outputActions" style="display:none;">
      <button class="ghost-btn" id="copyBtn">Copy to clipboard</button>
      <button class="ghost-btn" id="regenBtn">Regenerate</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="keyModal">
  <div class="modal">
    <h2>xAI (Grok) API key</h2>
    <p>Stored only in this browser's local storage — never sent anywhere except directly to api.x.ai when you draft a reply. Get a key at console.x.ai.</p>
    <input type="text" id="apiKeyInput" placeholder="xai-..." style="margin-top:10px;" />
    <div class="modal-actions">
      <button class="ghost-btn" id="saveKeyBtn">Save</button>
      <button class="ghost-btn" id="closeKeyBtn">Close</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = "reply_drafter_xai_key";

const keyBtn = document.getElementById("keyBtn");
const keyModal = document.getElementById("keyModal");
const apiKeyInput = document.getElementById("apiKeyInput");
const saveKeyBtn = document.getElementById("saveKeyBtn");
const closeKeyBtn = document.getElementById("closeKeyBtn");

const draftBtn = document.getElementById("draftBtn");
const regenBtn = document.getElementById("regenBtn");
const copyBtn = document.getElementById("copyBtn");
const output = document.getElementById("output");
const outputActions = document.getElementById("outputActions");
const errorMsg = document.getElementById("errorMsg");

function getKey() { return localStorage.getItem(STORAGE_KEY) || ""; }

function openKeyModal() {
  apiKeyInput.value = getKey();
  keyModal.classList.add("open");
}
keyBtn.onclick = openKeyModal;
closeKeyBtn.onclick = () => keyModal.classList.remove("open");
saveKeyBtn.onclick = () => {
  localStorage.setItem(STORAGE_KEY, apiKeyInput.value.trim());
  keyModal.classList.remove("open");
};

async function draftReply() {
  const key = getKey();
  if (!key) {
    openKeyModal();
    return;
  }

  const clientMessage = document.getElementById("clientMessage").value.trim();
  if (!clientMessage) {
    errorMsg.textContent = "Paste the client's message first.";
    errorMsg.style.display = "block";
    return;
  }
  errorMsg.style.display = "none";

  const tone = document.getElementById("tone").value;
  const context = document.getElementById("context").value.trim();

  draftBtn.disabled = true;
  draftBtn.textContent = "Drafting...";
  output.textContent = "Thinking...";
  output.classList.add("empty");
  outputActions.style.display = "none";

  const systemPrompt = `You are drafting an email reply on behalf of Vikash Saravanan, Founder & CEO of Logic Intelligence Technologies, a web/software development studio based in Coimbatore, India.

Write ONLY the reply body (no subject line, no "Dear X" placeholder guessing beyond what's given, no meta-commentary). Tone: ${tone}.
${context ? "Additional context from the founder: " + context : ""}

Sign off as:
Vikash Saravanan
Founder & CEO, Logic Intelligence Technologies

Keep it natural, specific to what the client actually wrote, and no longer than necessary.`;

  try {
    const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + key
      },
      body: JSON.stringify({
        model: "llama-3.1-8b-instant",
        messages: [
          { role: "system", content: systemPrompt },
          { role: "user", content: "Client's message:\n\n" + clientMessage }
        ],
        temperature: 0.6
      })
    });

    if (!res.ok) {
      const errText = await res.text();
      throw new Error("API error " + res.status + ": " + errText.slice(0, 200));
    }

    const data = await res.json();
    const reply = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;

    if (!reply) throw new Error("No reply returned.");

    output.textContent = reply;
    output.classList.remove("empty");
    outputActions.style.display = "flex";
  } catch (err) {
    errorMsg.textContent = "Failed to draft reply: " + err.message;
    errorMsg.style.display = "block";
    output.textContent = "Your drafted reply will appear here.";
    output.classList.add("empty");
  } finally {
    draftBtn.disabled = false;
    draftBtn.textContent = "Draft reply";
  }
}

draftBtn.onclick = draftReply;
regenBtn.onclick = draftReply;

copyBtn.onclick = () => {
  navigator.clipboard.writeText(output.textContent).then(() => {
    copyBtn.textContent = "Copied!";
    setTimeout(() => (copyBtn.textContent = "Copy to clipboard"), 1500);
  });
};
</script>

</body>
</html>
